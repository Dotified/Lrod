  <head>

    <title>LROD ON THE RELOAD — Links</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: dark;
        --ink: #101211;
        --paper: #f5f6ef;
        --mute: #a2aaa3;
        --line: #424842;
        --acid: #ff5148;
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        background: var(--ink);
        color: var(--paper);
        font-family: Arial, Helvetica, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image: linear-gradient(#ffffff08 1px, transparent 1px), linear-gradient(90deg, #ffffff08 1px, transparent 1px);
        background-size: 64px 64px;
        mask-image: linear-gradient(120deg, transparent 5%, #000 70%);
      }
      body::after {
        content: "";
        position: fixed;
        z-index: 0;
        inset: -30%;
        pointer-events: none;
        background: radial-gradient(circle at 24% 55%, #ff514816 0, transparent 35%);
        animation: ambient 12s ease-in-out infinite alternate;
      }
      a { color: inherit; }
      a:focus-visible { outline: 3px solid var(--acid); outline-offset: 5px; }
      .page {
        position: relative;
        max-width: 1180px;
        min-height: 100vh;
        margin: auto;
        padding: 27px clamp(22px, 5vw, 64px) 30px;
        display: flex;
        flex-direction: column;
      }
      .topbar, .footer { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
      .topbar { padding-bottom: 25px; border-bottom: 1px solid var(--line); }
      .brand {
        font-size: 1rem;
        font-weight: 900;
        letter-spacing: -.065em;
        text-decoration: none;
        white-space: nowrap;
      }
      .brand span { display: inline-block; margin-left: 3px; color: var(--acid); animation: turn 12s linear infinite; }
      .topbar-note, .edition, .section-kicker, .footer, .index, .badge {
        font-family: "Courier New", Courier, monospace;
        font-weight: 700;
        letter-spacing: .06em;
        text-transform: uppercase;
      }
      .topbar-note { color: var(--mute); font-size: .75rem; }
      main {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(340px, .86fr);
        gap: clamp(36px, 6vw, 90px);
        align-items: center;
        flex: 1;
        padding: clamp(42px, 8vh, 90px) 0;
      }
      .identity { min-width: 0; }
      .portrait-stage {
        position: relative;
        width: min(100%, 410px);
        height: 218px;
        margin: 0 0 12px;
        isolation: isolate;
        animation: rise .7s cubic-bezier(.2,.8,.2,1) both;
      }
      .banner-slice {
        position: absolute;
        top: 48px;
        right: 0;
        width: 78%;
        height: 112px;
        border: 1px solid #ffffff4b;
        background: linear-gradient(90deg, #10121133, #10121188), url('channel-banner.jpg') center / cover;
        filter: grayscale(1);
        opacity: .68;
        transform: rotate(4deg);
        animation: drift 7s ease-in-out infinite alternate;
      }
      .orbit {
        position: absolute;
        z-index: 1;
        top: -7px;
        left: -7px;
        width: 212px;
        height: 212px;
        border: 1px dashed var(--acid);
        border-radius: 50%;
        animation: turn 22s linear infinite;
      }
      .orbit::before, .orbit::after { content: ""; position: absolute; width: 8px; height: 8px; border-radius: 50%; background: var(--acid); }
      .orbit::before { left: 26px; top: 26px; }
      .orbit::after { right: 10px; bottom: 55px; }
      .photo-frame {
        position: absolute;
        z-index: 2;
        top: 9px;
        left: 9px;
        width: 190px;
        height: 190px;
        padding: 6px;
        border: 1px solid #fff;
        border-radius: 17px;
        background: #f1f1ea;
        box-shadow: 10px 13px 0 var(--acid), 0 30px 75px #0009;
        transform: rotate(-7deg);
        animation: portraitFloat 6s ease-in-out infinite;
      }
      .photo-frame img { display: block; width: 100%; height: 100%; border-radius: 10px; object-fit: cover; }
      .photo-label {
        position: absolute;
        z-index: 3;
        left: 214px;
        bottom: 18px;
        padding: 9px 12px;
        border: 1px solid var(--acid);
        background: var(--ink);
        color: var(--paper);
        font: 700 .73rem "Courier New", Courier, monospace;
        letter-spacing: .06em;
        white-space: nowrap;
        transform: rotate(3deg);
      }
      .spark { position: absolute; z-index: 3; color: var(--acid); font-size: 2.4rem; line-height: 1; animation: twinkle 3s ease-in-out infinite; }
      .spark.one { top: -10px; left: 230px; }
      .spark.two { right: 16px; bottom: 2px; font-size: 1.2rem; animation-delay: 1s; }
      .edition { margin: 26px 0 17px; color: var(--acid); font-size: .78rem; animation: rise .7s .1s both; }
      h1 {
        margin: 0;
        max-width: 630px;
        font-family: Impact, "Arial Narrow", "Arial Black", sans-serif;
        font-size: clamp(5.2rem, 11.7vw, 10.6rem);
        line-height: .79;
        font-weight: 900;
        letter-spacing: -.045em;
        text-transform: uppercase;
        animation: rise .7s .18s both;
      }
      h1 span { display: block; }
      h1 .small {
        margin: .38em 0 .23em .1em;
        color: var(--acid);
        font-family: "Courier New", Courier, monospace;
        font-size: .17em;
        line-height: 1;
        letter-spacing: .02em;
        white-space: nowrap;
      }
      .handle {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-top: 34px;
        color: var(--mute);
        font-size: .94rem;
        font-weight: 700;
        text-decoration: none;
        overflow-wrap: anywhere;
        animation: rise .7s .3s both;
      }
      .handle::before {
        content: "";
        display: inline-block;
        width: 8px;
        height: 8px;
        flex: none;
        border-radius: 50%;
        background: var(--acid);
      }
      .handle:hover { color: var(--paper); }
      .links-panel { min-width: 0; }
      .panel-header { display: flex; justify-content: space-between; align-items: baseline; gap: 20px; margin: 0 0 15px; }
      .section-kicker { margin: 0; color: var(--mute); font-size: .8rem; }
      .count { color: var(--acid); font-family: "Courier New", Courier, monospace; font-size: .8rem; }
      .links { display: grid; gap: 11px; }
      .link {
        position: relative;
        display: grid;
        grid-template-columns: 26px 42px minmax(0, 1fr) 36px;
        gap: 10px;
        align-items: center;
        min-height: 86px;
        padding: 16px 20px;
        border: 1px solid #555d55;
        border-radius: 15px;
        background: #1c201d;
        text-decoration: none;
        overflow: hidden;
        transition: background .25s ease, border-color .25s ease, transform .25s ease, box-shadow .25s ease;
        animation: rise .65s cubic-bezier(.2,.8,.2,1) both;
      }
      .link:nth-child(1) { animation-delay: .25s; }
      .link:nth-child(2) { animation-delay: .34s; }
      .link:nth-child(3) { animation-delay: .43s; }
      .link:nth-child(4) { animation-delay: .52s; }
      .link::after { content: ""; position: absolute; left: 0; right: 100%; bottom: 0; height: 3px; background: var(--acid); transition: right .3s ease; }
      .link:hover::after, .link:focus-visible::after { right: 0; }
      .link:hover { transform: translateY(-4px) translateX(3px); border-color: var(--acid); background: #2b2423; box-shadow: -6px 6px 0 #ff51483b; }
      .link.primary { min-height: 106px; border-color: var(--acid); background: var(--acid); color: var(--ink); }
      .link.primary:hover { background: #ff746d; }
      .link.primary::after { background: var(--ink); }
      .index { align-self: start; padding-top: 4px; color: var(--mute); font-size: .76rem; }
      .primary .index { color: #58312e; }
      .icon { display: grid; place-items: center; width: 40px; height: 40px; border: 1px solid #ffffff38; border-radius: 11px; background: #ffffff0c; transition: transform .25s ease; }
      .primary .icon { border-color: #10121140; background: #10121112; }
      .link:hover .icon { transform: rotate(-10deg) scale(1.1); }
      .icon svg { width: 23px; height: 23px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .icon .fill { fill: currentColor; stroke: none; }
      .link-title { display: block; font-size: clamp(1.14rem, 2vw, 1.38rem); line-height: 1.1; font-weight: 900; letter-spacing: -.035em; }
      .link-sub { display: block; margin-top: 5px; color: var(--mute); font-size: .84rem; line-height: 1.25; }
      .primary .link-sub { color: #58312e; }
      .arrow { width: 34px; height: 34px; display: grid; place-items: center; border: 1px solid currentColor; border-radius: 50%; transition: transform .2s ease; }
      .link:hover .arrow { transform: translate(2px, -2px); }
      .arrow svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .footer { padding-top: 24px; border-top: 1px solid var(--line); color: var(--mute); font-size: .68rem; }
      .footer strong { color: var(--paper); }
      .footer .mark { display: inline-block; color: var(--acid); font-size: 1rem; line-height: .7; animation: turn 12s linear infinite; }
      @keyframes rise { from { opacity: 0; transform: translateY(19px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes turn { to { transform: rotate(360deg); } }
      @keyframes portraitFloat { 0%,100% { transform: rotate(-7deg) translateY(0); } 50% { transform: rotate(-5deg) translateY(-7px); } }
      @keyframes drift { to { transform: rotate(2deg) translate(5px, -4px); } }
      @keyframes twinkle { 0%,100% { opacity: .45; transform: scale(.8) rotate(0); } 50% { opacity: 1; transform: scale(1.15) rotate(25deg); } }
      @keyframes ambient { to { transform: translate(8%, -5%); } }
      @media (max-width: 800px) {
        .page { max-width: 640px; }
        main { grid-template-columns: 1fr; gap: 45px; align-content: start; padding: 43px 0 65px; }
        .portrait-stage { height: 168px; width: min(100%, 340px); }
        .photo-frame { width: 144px; height: 144px; }
        .orbit { width: 164px; height: 164px; }
        .banner-slice { top: 31px; height: 86px; }
        .photo-label { left: 160px; bottom: 4px; font-size: .62rem; }
        .spark.one { left: 177px; font-size: 1.8rem; }
        .edition { margin: 20px 0 15px; }
        h1 { font-size: clamp(5.1rem, 20vw, 8.5rem); }
        .handle { margin-top: 22px; }
      }
      @media (max-width: 410px) {
        .topbar-note { font-size: .67rem; }
        .link { grid-template-columns: 22px 34px minmax(0, 1fr) 30px; gap: 8px; padding: 14px 13px; }
        .icon { width: 32px; height: 32px; border-radius: 9px; }
        .icon svg { width: 19px; height: 19px; }
        .arrow { width: 30px; height: 30px; }
        h1 { font-size: clamp(4.6rem, 21vw, 5.5rem); }
      }
      @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
    </style>
